# Self-contained Foundry project for the Glamsterdam relay-guard tests.
# Compiles the contracts in ../contracts (this branch = patched OptimismPortal 1.7.3) against
# dependencies installed by `npm install` in this folder.
[profile.default]
src = 'src'
test = 'test'
out = 'out'
libs = ['node_modules']
solc_version = '0.8.15'
optimizer = true
optimizer_runs = 999999
bytecode_hash = 'none'
evm_version = 'amsterdam'   # Glamsterdam: EIP-8037 / EIP-8038 gas schedule
gas_limit = 9223372036854775807
allow_paths = ['..']
remappings = [
  'contracts/=../contracts/',
  '@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/',
  '@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/',
  '@rari-capital/solmate/=node_modules/@rari-capital/solmate/',
  'forge-std/=node_modules/forge-std/src/',
]

