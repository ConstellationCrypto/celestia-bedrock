# Self-contained Foundry project for the Glamsterdam relay guard: local tests, fork test and the
# deployment script. Compiles the contracts in ../src (this branch = OptimismPortal 2.6.1) with the
# repo's pinned submodules (git submodule update --init: openzeppelin-contracts,
# openzeppelin-contracts-upgradeable, solmate) and forge-std from `npm install` in this folder.
# solc 0.8.15 always emits london bytecode, so evm_version only selects the EVM tests and scripts
# run on.
[profile.default]
src = 'helpers'
test = 'test'
script = 'script'
out = 'out'
libs = ['node_modules']
solc_version = '0.8.15'
optimizer = true
optimizer_runs = 999999
bytecode_hash = 'none'
evm_version = 'amsterdam'
gas_limit = 9223372036854775807
allow_paths = ['..']
fs_permissions = [
  { access = 'read', path = './deploy' },
  { access = 'read-write', path = './deploy/out' },
]
remappings = [
  'src/=../src/',
  '@openzeppelin/contracts-upgradeable/=../lib/openzeppelin-contracts-upgradeable/contracts/',
  '@openzeppelin/contracts/=../lib/openzeppelin-contracts/contracts/',
  '@rari-capital/solmate/=../lib/solmate/',
  'forge-std/=node_modules/forge-std/src/',
]
