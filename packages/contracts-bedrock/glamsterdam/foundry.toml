# Self-contained Foundry project for the Glamsterdam relay guard: local tests, fork test and the
# deployment script. Compiles the contracts in ../contracts (this branch = OptimismPortal 1.7.3)
# against dependencies installed by `npm install` in this folder. solc 0.8.15 always emits london
# bytecode, so evm_version only selects the EVM the tests and scripts run on.
[profile.default]
src = 'src'
test = 'test'
script = 'script'
out = 'out'
libs = ['node_modules']
solc_version = '0.8.15'
optimizer = true
optimizer_runs = 999999
bytecode_hash = 'none'
evm_version = 'amsterdam'   # Glamsterdam: EIP-8037 / EIP-8038 gas schedule
gas_limit = 9223372036854775807
allow_paths = ['..']
fs_permissions = [
  { access = 'read', path = './deploy' },
  { access = 'read-write', path = './deploy/out' },
]
remappings = [
  'contracts/=../contracts/',
  '@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/',
  '@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/',
  '@rari-capital/solmate/=node_modules/@rari-capital/solmate/',
  'forge-std/=node_modules/forge-std/src/',
]

